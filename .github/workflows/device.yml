name: DSH standalone iOS app

# Builds the self-contained DSH app: iSH ARM64 engine + Alpine rootfs with
# Node.js and the official DSH package preinstalled at build time. The app
# serves `dsh web` inside the guest and shows it in a WKWebView; no desktop or
# network helper is involved.
#
# The IPA is unsigned (CI has no signing identity). Re-sign it with Sideloadly,
# AltStore, or Xcode using your own certificate before installing.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install toolchain
        run: brew install meson ninja llvm libarchive lld

      - name: Fetch OpenMinis and ish-arm64
        run: |
          git clone --depth 1 --recurse-submodules --shallow-submodules \
            https://github.com/OpenMinis/OpenMinis.git
          cd OpenMinis && git submodule status

      - name: Bound the guest uname hostname copy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("OpenMinis/deps/ish/kernel/uname.c")
          source = path.read_text()
          old = "    strcpy(uts->hostname, hostname);"
          new = '    snprintf(uts->hostname, sizeof(uts->hostname), "%s", hostname);'
          assert source.count(old) == 1
          path.write_text(source.replace(old, new))
          PY
          git -C OpenMinis/deps/ish diff --check

      - name: Make fakefsify honour the process locale
        run: |
          # Alpine ships a CA certificate with a non-ASCII filename. libarchive
          # converts pathnames from UTF-8 using the C library locale, but
          # fakefsify never calls setlocale(), so LANG from the environment has
          # no effect and the import aborts with "Pathname can't be converted".
          python3 - <<'PY'
          from pathlib import Path
          path = Path("OpenMinis/deps/ish/tools/fakefsify.c")
          source = path.read_text()
          includes = "#include <stdio.h>"
          assert source.count(includes) == 1
          source = source.replace(includes, "#include <locale.h>\n" + includes)
          main = "int main(int argc, const char *argv[]) {\n"
          assert source.count(main) == 1
          source = source.replace(main, main + "    setlocale(LC_ALL, \"\");\n")
          path.write_text(source)
          PY
          git -C OpenMinis/deps/ish diff --check

      - name: Build iSH libraries (device + simulator)
        run: |
          mkdir -p "$RUNNER_TEMP/lld-bin"
          LLD_BIN="$(brew --prefix lld)/bin"
          for tool in ld.lld lld ld64.lld; do
            [ -e "$LLD_BIN/$tool" ] && ln -sf "$LLD_BIN/$tool" "$RUNNER_TEMP/lld-bin/$tool"
          done
          export PATH="$RUNNER_TEMP/lld-bin:$PATH"
          command -v ld.lld && ld.lld --version
          cd OpenMinis && ./deps/build_ish.sh release --all

      - name: Verify the device libraries target iOS
        run: |
          echo "iphoneos SDK: $(xcrun --sdk iphoneos --show-sdk-path)"
          for lib in libish.a libish_emu.a libfakefs.a libish_aot.a; do
            echo "--- deps/libs/$lib ---"
            rm -rf "$RUNNER_TEMP/vt" && mkdir -p "$RUNNER_TEMP/vt"
            (cd "$RUNNER_TEMP/vt" && ar x "$GITHUB_WORKSPACE/OpenMinis/deps/libs/$lib")
            ls "$RUNNER_TEMP/vt"/*.o >/dev/null 2>&1 || {
              echo "::warning::$lib has no object members to inspect"; continue; }
            member="$(ls "$RUNNER_TEMP/vt"/*.o | head -1)"
            lipo -info "$member"
            vtool -show-build "$member" | tee "$RUNNER_TEMP/vtool-$lib.txt"
            grep -q "platform IOS" "$RUNNER_TEMP/vtool-$lib.txt" || {
              echo "::error::$lib is not built for the iOS device platform"; exit 1; }
          done

      - name: Build fakefsify for the host
        run: |
          cd OpenMinis/deps/ish
          meson setup build-native --buildtype=release \
            -Dlog= -Dkernel=ish -Dengine=asbestos -Dguest_arch=arm64
          ninja -C build-native tools/fakefsify
          ./build-native/tools/fakefsify 2>&1 | head -2 || true

      - name: Build the DSH node_modules tree for Alpine arm64
        run: tools/build-dsh-tree.sh "$RUNNER_TEMP/dsh-tree"

      - name: Assemble the Alpine rootfs with Node and DSH
        run: |
          python3 tools/prepare-dsh-rootfs.py \
            --dsh-tree "$RUNNER_TEMP/dsh-tree" \
            --output OpenMinis/deps/resources/alpine-rootfs \
            --fakefsify OpenMinis/deps/ish/build-native/tools/fakefsify \
            --work "$RUNNER_TEMP/rootfs-work"

      - name: Link the app against the device libraries
        run: |
          set -o pipefail
          rm -rf deps
          ln -s OpenMinis/deps deps
          xcodebuild \
            -project ios/ISHProbe.xcodeproj \
            -scheme ISHProbe \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/derived" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            STRIP_INSTALLED_PRODUCT=NO COPY_PHASE_STRIP=NO DEPLOYMENT_POSTPROCESSING=NO \
            build | tee "$RUNNER_TEMP/device-xcodebuild.log"

      - name: Verify the app contains the engine and the DSH image
        run: |
          APP="$RUNNER_TEMP/derived/Build/Products/Release-iphoneos/ISHProbe.app"
          test -d "$APP" || { echo "::error::app was not produced"; exit 1; }
          echo "--- app binary platform ---"
          vtool -show-build "$APP/ISHProbe" | tee "$RUNNER_TEMP/vtool-app.txt"
          grep -q "platform IOS" "$RUNNER_TEMP/vtool-app.txt" || {
            echo "::error::app binary is not an iOS device build"; exit 1; }
          echo "--- engine symbols ---"
          for symbol in _do_execve _mount_root _jit_control '_OBJC_CLASS_$_WKWebView'; do
            nm "$APP/ISHProbe" | grep -qF " $symbol" || {
              echo "::error::engine symbol $symbol is missing from the app"; exit 1; }
            echo "ok: $symbol"
          done
          echo "--- bundled rootfs ---"
          test -f "$APP/alpine-rootfs/meta.db" || { echo "::error::meta.db missing"; exit 1; }
          test -x "$APP/alpine-rootfs/data/usr/bin/node" || { echo "::error::node missing"; exit 1; }
          test -f "$APP/alpine-rootfs/data/opt/dsh/node_modules/@deepseek-ai/dsh/lib/bin.js" || {
            echo "::error::DSH is missing from the image"; exit 1; }
          test -f "$APP/alpine-rootfs/data/opt/dsh/node_modules/@koromix/koffi-linux-arm64/musl_arm64/koffi.node" || {
            echo "::error::koffi musl arm64 binary is missing"; exit 1; }
          plutil -p "$APP/Info.plist" | grep -q "NSAllowsLocalNetworking" || {
            echo "::error::ATS local networking exception is missing"; exit 1; }
          du -sh "$APP" "$APP/alpine-rootfs/data" "$APP/alpine-rootfs/meta.db"
          echo "--- linked frameworks ---"
          otool -L "$APP/ISHProbe" | grep -E "WebKit|sqlite|resolv"

      - name: Package the unsigned IPA
        run: |
          APP="$RUNNER_TEMP/derived/Build/Products/Release-iphoneos/ISHProbe.app"
          mkdir -p "$RUNNER_TEMP/pkg/Payload"
          cp -R "$APP" "$RUNNER_TEMP/pkg/Payload/"
          cd "$RUNNER_TEMP/pkg"
          zip -qry "$RUNNER_TEMP/DSH-unsigned.ipa" Payload
          ls -lh "$RUNNER_TEMP/DSH-unsigned.ipa"
          unzip -l "$RUNNER_TEMP/DSH-unsigned.ipa" | head -20

      - name: Package the runtime for the simulator test
        run: |
          cd OpenMinis/deps
          tar -czf "$RUNNER_TEMP/dsh-runtime.tar.gz" libs include resources
          ls -lh "$RUNNER_TEMP/dsh-runtime.tar.gz"

      - name: Upload the unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: DSH-unsigned-ipa
          path: ${{ runner.temp }}/DSH-unsigned.ipa
          if-no-files-found: error

      - name: Publish the unsigned IPA and runtime
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dsh-latest
          name: DSH standalone iOS build
          files: |
            ${{ runner.temp }}/DSH-unsigned.ipa
            ${{ runner.temp }}/dsh-runtime.tar.gz
          prerelease: true
