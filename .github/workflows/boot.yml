name: DSH simulator boot test

# Boots the same Alpine + Node + DSH image used by the device app inside the
# iOS simulator, starts `dsh web`, and fetches the printed token URL from the
# test host. Guest sockets are real host sockets, so a 200 response proves the
# guest Node process actually serves the UI.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boot:
    runs-on: macos-latest
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4

      - name: Download the DSH runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download dsh-latest \
            --pattern dsh-runtime.tar.gz \
            --dir "$RUNNER_TEMP" --clobber
          mkdir -p deps
          tar -xzf "$RUNNER_TEMP/dsh-runtime.tar.gz" -C deps
          ls -lh deps/libs/iphonesimulator deps/resources/alpine-rootfs
          test -f deps/resources/alpine-rootfs/data/opt/dsh/node_modules/@deepseek-ai/dsh/lib/bin.js
          test -f deps/resources/alpine-rootfs/data/usr/bin/node

      - name: Select an available iPhone simulator
        run: |
          DEVICE_UDID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); devices=[d for runtime in data["devices"].values() for d in runtime if d.get("isAvailable") and d["name"].startswith("iPhone")]; print(devices[0]["udid"] if devices else "")')"
          test -n "$DEVICE_UDID"
          echo "DEVICE_UDID=$DEVICE_UDID" >> "$GITHUB_ENV"
          xcrun simctl list devices available | grep -F "$DEVICE_UDID"

      - name: Boot Alpine and serve DSH web in XCTest
        run: |
          set -o pipefail
          xcodebuild test \
            -project ios/ISHProbe.xcodeproj \
            -scheme ISHProbe \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$DEVICE_UDID" \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 3600 \
            -maximum-test-execution-time-allowance 3600 \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/ish-boot-xcodebuild.log"

      - name: Dump guest crash diagnostics
        if: always()
        run: |
          for dir in \
            "$HOME/Library/Logs/DiagnosticReports" \
            "$HOME/Library/Developer/CoreSimulator/Devices/$DEVICE_UDID/data/Library/Logs/DiagnosticReports"; do
            [ -d "$dir" ] || continue
            for report in "$dir"/ISHProbe*.ips; do
              [ -f "$report" ] || continue
              echo "===== $report ====="
              python3 -c 'import pathlib,sys; sys.stdout.write(pathlib.Path(sys.argv[1]).read_text(errors="replace"))' "$report"
              echo
            done
          done
          xcrun simctl spawn "$DEVICE_UDID" log show --last 5m \
            --style compact --predicate 'process == "ISHProbe"' || true
