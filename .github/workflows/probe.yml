name: iSH engine probe

# Feasibility gate before touching the app: can we even build OpenMinis'
# ish-arm64 into iOS static libraries, and produce an Alpine rootfs for it?
# Builds use OpenMinis' own scripts with explicitly logged source patches.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: brew install meson ninja llvm libarchive lld

      - name: Fetch OpenMinis and ish-arm64
        run: |
          git clone --depth 1 --recurse-submodules --shallow-submodules \
            https://github.com/OpenMinis/OpenMinis.git
          cd OpenMinis && git submodule status

      - name: Bound the guest uname hostname copy
        run: |
          # The guest utsname fields are 65 bytes, while Darwin's nodename can
          # be longer. The unbounded copy traps in __strcpy_chk on iOS.
          python3 - <<'PY'
          from pathlib import Path
          path = Path("OpenMinis/deps/ish/kernel/uname.c")
          source = path.read_text()
          old = "    strcpy(uts->hostname, hostname);"
          new = '    snprintf(uts->hostname, sizeof(uts->hostname), "%s", hostname);'
          assert source.count(old) == 1
          path.write_text(source.replace(old, new))
          PY
          git -C OpenMinis/deps/ish diff --check
          git -C OpenMinis/deps/ish diff -- kernel/uname.c

      - name: Build iSH static libraries
        run: |
          # brew's llvm is keg-only, so `clang -fuse-ld=lld` (used for the guest
          # VDSO) cannot find ld.lld. Expose just the linker, not LLVM's clang:
          # the meson cross file must keep using Xcode's clang.
          mkdir -p "$RUNNER_TEMP/lld-bin"
          LLD_BIN="$(brew --prefix lld)/bin"
          ls -l "$LLD_BIN"
          for tool in ld.lld lld ld64.lld; do
            [ -e "$LLD_BIN/$tool" ] && ln -sf "$LLD_BIN/$tool" "$RUNNER_TEMP/lld-bin/$tool"
          done
          export PATH="$RUNNER_TEMP/lld-bin:$PATH"
          command -v ld.lld && ld.lld --version

          # Reproduce the exact failing invocation on a trivial input first, so
          # a linker problem fails here in seconds instead of mid-build.
          printf 'void f(void){}\n' > "$RUNNER_TEMP/probe.c"
          "$(brew --prefix llvm)/bin/clang" -target aarch64-linux-gnu \
            -fuse-ld=lld -nostdlib -shared \
            -o "$RUNNER_TEMP/probe.so" "$RUNNER_TEMP/probe.c"
          echo 'lld link probe OK'
          cd OpenMinis && ./deps/build_ish.sh release --all

      - name: Prepare Alpine rootfs
        run: cd OpenMinis && ./deps/prepare_alpine_rootfs.sh 3.23

      - name: Inventory
        run: |
          ls -lh OpenMinis/deps/libs OpenMinis/deps/libs/iphonesimulator
          du -sh OpenMinis/deps/resources/* 2>/dev/null || true

      - name: Package
        run: |
          cd OpenMinis/deps && tar -czf "$GITHUB_WORKSPACE/ish-ios-libs.tar.gz" \
            libs include resources

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: probe-latest
          name: iSH iOS libraries + Alpine rootfs
          files: ish-ios-libs.tar.gz
          prerelease: true
